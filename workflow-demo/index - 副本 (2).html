<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级自动化建模工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: transparent; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -4px; }
        #split-ratio { height: 8px; border-radius: 4px; background: linear-gradient(to right, #2563eb 80%, #e5e7eb 80%); }
        @keyframes breathing { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .breathing-bar { animation: breathing 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">自动建模工作台</h1>
            <p class="text-gray-600">智能 · 高效 · 可解释</p>
        </header>

        <div class="bg-white shadow rounded-lg p-6">
            <!-- 阶段1: 配置 -->
            <div id="setup-view">
                <h2 class="text-xl font-semibold mb-6 border-b pb-2">1. 启动配置</h2>
                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <label class="block text-sm font-medium text-gray-700">上传数据集 (CSV/TXT)</label>
                        <input type="file" id="file-upload" class="w-full p-2 border rounded">
                        <label class="block text-sm font-medium text-gray-700 mt-4">训练/测试集占比</label>
                        <input type="range" id="split-ratio" min="50" max="90" value="80" class="w-full h-2 rounded-lg appearance-none cursor-pointer bg-gray-200">
                        <span id="split-label" class="text-sm text-gray-600">80%</span>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-sm font-medium text-gray-700">目标变量 (Y)</label>
                        <select id="target-var" class="w-full border p-2 rounded"><option>-- 请先上传文件 --</option></select>
                        <label class="block text-sm font-medium text-gray-700 mt-4">模型任务类型</label>
                        <select id="task-type" class="w-full border p-2 rounded"><option>分类任务</option><option>回归任务</option></select>
                    </div>
                </div>
                <button id="start-btn" class="w-full mt-6 bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">开始自动建模</button>
            </div>

            <!-- 阶段2: 处理 -->
            <div id="process-view" class="hidden">
                <div class="w-full bg-gray-200 rounded-full h-3 mb-8"><div id="p-bar" class="bg-blue-600 h-3 rounded-full breathing-bar" style="width: 0%"></div></div>
                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="p-4 border rounded bg-green-50 text-green-700 font-bold text-center">数据加载</div>
                    <div class="p-4 border rounded bg-green-50 text-green-700 font-bold text-center">特征工程</div>
                    <div class="p-4 border rounded bg-blue-100 text-blue-700 font-bold text-center border-blue-400">模型训练</div>
                    <div class="p-4 border rounded bg-gray-50 text-gray-400 font-bold text-center">模型评估</div>
                </div>
                <div class="bg-blue-50 p-4 rounded mb-6">
                    <h3 class="font-bold text-blue-900 mb-2">💡 建模思想</h3>
                    <p class="text-sm text-blue-800">采用层叠堆叠技术，通过多模型并行训练与深度特征融合，自动化构建稳健的预测模型，在最大化准确性的同时有效降低过拟合风险。</p>
                </div>
                <div class="bg-white border rounded p-4">
                    <h3 class="font-bold text-gray-700 mb-3">⚡ 系统运行日志</h3>
                    <div id="log-content" class="bg-gray-50 text-gray-600 p-4 font-mono text-sm h-48 overflow-y-auto"></div>
                </div>
                <button id="view-report-btn" class="hidden mt-6 w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">查看模型效果</button>
            </div>
            
            <!-- 阶段3: 报告 -->
            <div id="result-view" class="hidden">
                <h2 class="text-xl font-semibold mb-6 border-b pb-2 text-blue-900">3. 模型分析报告</h2>
                <div id="report-content" class="grid grid-cols-4 gap-4 mb-8"></div>
                <div id="detail-view" class="grid grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>
    <script>
        let uploadedFilePath = '';
        let lastReport = null;

        const slider = document.getElementById('split-ratio');
        slider.style.background = 'linear-gradient(to right, #2563eb 80%, #e5e7eb 80%)';
        slider.oninput = (e) => {
            const val = e.target.value;
            document.getElementById('split-label').innerText = val + '%';
            e.target.style.background = 'linear-gradient(to right, #2563eb ' + val + '%, #e5e7eb ' + val + '%)';
        };
        document.getElementById('start-btn').onclick = async () => {
            const target = document.getElementById('target-var').value;
            const res = await fetch('http://127.0.0.1:8001/model/start?target=' + target + '&path=' + encodeURIComponent(uploadedFilePath), { method: 'POST' });
            const data = await res.json();
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('process-view').classList.remove('hidden');
            pollStatus(data.task_id);
        };
        
        function pollStatus(taskId) {
            const poll = setInterval(async () => {
                const res = await fetch('http://127.0.0.1:8001/model/status/' + taskId);
                const data = await res.json();
                document.getElementById('p-bar').style.width = data.progress + '%';
                const logRes = await fetch('http://127.0.0.1:8001/model/logs/' + taskId);
                const logData = await logRes.json();
                document.getElementById('log-content').innerHTML = logData.logs.map(l => '<p>'+l+'</p>').join('');
                if (data.status === 'completed') { 
                    clearInterval(poll); 
                    lastReport = data.report;
                    document.getElementById('view-report-btn').classList.remove('hidden');
                }
            }, 1000);
        }

        document.getElementById('view-report-btn').onclick = () => renderReport(lastReport);

        function renderReport(report) {
            document.getElementById('process-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            var aucPerc = (report.auc * 100).toFixed(1) + '%';
            document.getElementById('report-content').innerHTML = 
                '<div class="bg-blue-50 p-4 rounded shadow-sm text-center"><div class="text-xs text-blue-600">准确率</div><div class="text-2xl font-bold text-blue-900">' + aucPerc + '</div></div>' +
                '<div class="bg-blue-50 p-4 rounded shadow-sm text-center"><div class="text-xs text-blue-600">KS值</div><div class="text-2xl font-bold text-blue-900">' + report.ks + '</div></div>' +
                '<div class="bg-blue-50 p-4 rounded shadow-sm text-center"><div class="text-xs text-blue-600">AR值</div><div class="text-2xl font-bold text-blue-900">' + report.ar + '</div></div>' +
                '<div class="bg-blue-50 p-4 rounded shadow-sm text-center"><div class="text-xs text-blue-600">训练耗时</div><div class="text-2xl font-bold text-blue-900">' + report.training_time + 's</div></div>';

            var featureHtml = report.features.map(f => 
                '<tr class="border-b border-gray-100">' +
                    '<td class="p-3 text-gray-700">' + f.name + '</td>' +
                    '<td class="p-3 font-mono text-blue-600">' + f.iv + '</td>' +
                '</tr>'
            ).join('');
            
            document.getElementById('detail-view').innerHTML = 
                '<div class="bg-white p-6 border rounded shadow-sm">' +
                    '<h3 class="font-bold mb-4 text-blue-900">特征解释性 (IV)</h3>' +
                    '<table class="w-full text-sm">' +
                        '<thead><tr class="text-gray-400 border-b"><th class="p-3 text-left">变量名</th><th class="p-3 text-left">IV值</th></tr></thead>' +
                        '<tbody>' + featureHtml + '</tbody>' +
                    '</table>' +
                '</div>' +
                '<div class="bg-blue-900 text-white p-6 rounded shadow-lg">' +
                    '<h3 class="font-bold mb-4 text-white">AI 专家深度解读</h3>' +
                    '<div class="text-sm leading-relaxed whitespace-pre-line text-blue-100">' + report.ai_expert + '</div>' +
                '</div>';
        }
        
        document.getElementById('file-upload').onchange = async (e) => {
            const fd = new FormData(); fd.append('file', e.target.files[0]);
            const res = await fetch('http://127.0.0.1:8001/upload', { method: 'POST', body: fd });
            const data = await res.json();
            uploadedFilePath = data.path;
            document.getElementById('target-var').innerHTML = data.columns.map(c => '<option value="'+c+'">'+c+'</option>').join('');
        };
    </script>
</body>
</html>
